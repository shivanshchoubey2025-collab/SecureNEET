{% extends 'base.html' %}
{% block title %}Reset Password — SecureNEET{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Password Recovery</h1>
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your registered email address to receive password reset instructions.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label for="email" class="form-label">Registered Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="candidate@example.com" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{{ url_for('auth.login') }}" style="font-size: 0.9rem;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
