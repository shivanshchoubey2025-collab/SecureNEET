{% extends 'base.html' %}
{% block title %}Set New Password — SecureNEET{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Create New Password</h1>
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter and confirm your new secure password.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="password" class="form-label">New Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
