{% extends 'base.html' %}
{% block title %}{% if exam %}Edit Examination{% else %}Create Examination{% endif %} — SecureNEET Admin{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 1.5rem auto;">
  <div class="card" style="padding: 2rem;">
    <div class="card-header">
      <h1 class="card-title">{% if exam %}Edit Examination: {{ exam.title }}{% else %}Create New Examination{% endif %}</h1>
    </div>

    <form method="POST" action="{% if exam %}{{ url_for('admin.edit_exam', exam_id=exam.id) }}{% else %}{{ url_for('admin.create_exam') }}{% endif %}">
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="title" class="form-label">Examination Title *</label>
          <input type="text" id="title" name="title" class="form-control" value="{{ exam.title if exam else '' }}" placeholder="e.g. NEET (UG) 2026 Grand Mock Test" required>
        </div>
        <div class="form-group">
          <label for="code" class="form-label">Exam Code *</label>
          <input type="text" id="code" name="code" class="form-control" value="{{ exam.code if exam else '' }}" placeholder="e.g. NEET-MOCK-26" required style="font-family: monospace;">
        </div>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Description & Syllabus Coverage</label>
        <textarea id="description" name="description" class="form-control" rows="3" placeholder="Syllabus guidelines, instructions, and test notes...">{{ exam.description if exam else '' }}</textarea>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem;">
        <div class="form-group">
          <label for="duration_minutes" class="form-label">Duration (Minutes) *</label>
          <input type="number" id="duration_minutes" name="duration_minutes" class="form-control" value="{{ exam.duration_minutes if exam else 180 }}" min="10" max="600" required>
        </div>
        <div class="form-group">
          <label for="total_marks" class="form-label">Total Marks *</label>
          <input type="number" id="total_marks" name="total_marks" class="form-control" value="{{ exam.total_marks if exam else 720 }}" required>
        </div>
        <div class="form-group">
          <label for="passing_marks" class="form-label">Passing Marks</label>
          <input type="number" id="passing_marks" name="passing_marks" class="form-control" value="{{ exam.passing_marks if exam else 360 }}">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="positive_marks" class="form-label">Correct Response Marks (+)</label>
          <input type="number" step="0.5" id="positive_marks" name="positive_marks" class="form-control" value="{{ exam.positive_marks if exam else 4.0 }}" required>
        </div>
        <div class="form-group">
          <label for="negative_marks" class="form-label">Negative Marking Deduction (-)</label>
          <input type="number" step="0.25" id="negative_marks" name="negative_marks" class="form-control" value="{{ exam.negative_marks if exam else 1.0 }}" required>
        </div>
      </div>

      <div class="form-group" style="margin-top: 0.5rem; background: #f8fafc; padding: 1rem; border-radius: 6px; border: 1px solid #e2e8f0;">
        <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; font-weight: 600; color: #0f172a;">
          <input type="checkbox" name="is_published" value="1" {% if exam and exam.is_published %}checked{% endif %} style="width: 18px; height: 18px;">
          Publish Immediately (Visible to candidates for attempting)
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          {% if exam %}Save Examination Changes{% else %}Create Examination{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
